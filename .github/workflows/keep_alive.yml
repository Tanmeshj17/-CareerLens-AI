name: Keep Render Backend Alive

on:
  schedule:
    # Run every 10 minutes to prevent Render's free tier from sleeping (which happens after 15 mins)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API Health Endpoint
        run: curl -s https://careerlens-api.onrender.com/api/health
