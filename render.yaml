services:
  # Web API Service (FastAPI) + Embedded APScheduler (Free Tier Ready)
  - type: web
    name: careerlens-api
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: careerlens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: FRONTEND_URL
        value: https://career-lens-ai-wheat.vercel.app
      # ── Email Delivery (Gmail SMTP — set these in Render Dashboard → Environment) ──
      # SMTP_USER  = your Gmail address (e.g. careerlensai@gmail.com)
      # SMTP_PASSWORD = your 16-char Gmail App Password (not your real Gmail password)
      # Generate App Password at: https://myaccount.google.com/apppasswords
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: EMAIL_FROM
        value: CareerLens AI <onboarding@resend.dev>

databases:
  # Managed PostgreSQL Database (Free Tier)
  - name: careerlens-db
    databaseName: careerlens
    user: careerlens_admin
    region: oregon
    plan: free
