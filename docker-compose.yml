version: '3.8'

services:
  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - careerlens-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://careerlens:careerlens123@db:5432/careerlens
      - SECRET_KEY=careerlens_super_secret_key_change_in_production
      - FRONTEND_URL=http://localhost
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - careerlens-net

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: careerlens
      POSTGRES_PASSWORD: careerlens123
      POSTGRES_DB: careerlens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U careerlens"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - careerlens-net

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@careerlens.ai
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - careerlens-net

volumes:
  postgres_data:

networks:
  careerlens-net:
