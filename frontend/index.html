<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0050cb" />
    <meta name="description" content="CareerLens AI — See Your Career Clearly. AI-Powered Job Intelligence, ATS Resume Analysis, and Structured Career Roadmaps." />
    <title>CareerLens AI — See Your Career Clearly.</title>

    <!-- Critical: Preconnect to external origins BEFORE anything else -->
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://careerlens-api-f74a.onrender.com" crossorigin />
    <link rel="dns-prefetch" href="https://careerlens-api-f74a.onrender.com" />

    <!-- Non-blocking font load: use media=print trick, swap to all after load -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" />
    </noscript>

    <!-- Non-blocking Material Symbols load -->
    <link rel="preload" as="style"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap"
      onload="this.onload=null;this.rel='stylesheet'" />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0&display=swap" />
    </noscript>

    <!-- Inline critical CSS: instant skeleton/spinner so page never looks blank -->
    <style>
      *,::before,::after{box-sizing:border-box;margin:0;padding:0}
      html,body,#root{height:100%;background:#0a0f1e;color:#e2e8f0;font-family:system-ui,sans-serif}
      #app-loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#0a0f1e;z-index:9999;transition:opacity .3s}
      #app-loading .spinner{width:40px;height:40px;border:3px solid rgba(0,80,203,.2);border-top-color:#0050cb;border-radius:50%;animation:spin .8s linear infinite}
      #app-loading .brand{font-size:1.1rem;font-weight:700;color:#0050cb;letter-spacing:.03em}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <!-- Instant loading indicator shown before JS boots -->
    <div id="app-loading">
      <div class="spinner"></div>
      <div class="brand">CareerLens AI</div>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <!-- Kick off backend warm-up immediately, before React even loads -->
    <script>
      fetch('https://careerlens-api-f74a.onrender.com/health', { method: 'GET', mode: 'no-cors' })
        .catch(() => {});
    </script>
  </body>
</html>
