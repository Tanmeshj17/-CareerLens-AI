<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="fav-lens" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0066ff"/>
      <stop offset="100%" stopColor="#003fa4"/>
    </linearGradient>
    <linearGradient id="fav-cyan" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#38bdf8"/>
      <stop offset="100%" stopColor="#0050cb"/>
    </linearGradient>
    <linearGradient id="fav-tie" x1="50" y1="24" x2="50" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#ffffff"/>
      <stop offset="60%" stopColor="#e0f2fe"/>
      <stop offset="100%" stopColor="#bae6fd"/>
    </linearGradient>
    <filter id="fav-shadow" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0050cb" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Focus Ring -->
  <circle cx="50" cy="50" r="42" stroke="url(#fav-lens)" stroke-width="6" stroke-linecap="round" stroke-dasharray="46 12 46 12"/>
  <!-- Optical Disc -->
  <circle cx="50" cy="50" r="34" fill="url(#fav-cyan)" filter="url(#fav-shadow)"/>
  <!-- Reflection -->
  <path d="M 28 32 A 26 26 0 0 1 68 24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75"/>
  <!-- Tie Knot -->
  <path d="M 43 30 L 57 30 L 55 38 L 45 38 Z" fill="#ffffff"/>
  <!-- Tie Blade -->
  <path d="M 45 38 L 55 38 L 57 62 L 50 72 L 43 62 Z" fill="url(#fav-tie)"/>
  <!-- Center Crease -->
  <line x1="50" y1="38" x2="50" y2="70" stroke="#0050cb" stroke-width="1.5" stroke-opacity="0.35" stroke-linecap="round"/>
  <!-- Optical Brackets -->
  <path d="M 16 28 L 16 16 L 28 16" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 84 28 L 84 16 L 72 16" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 16 72 L 16 84 L 28 84" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 84 72 L 84 84 L 72 84" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>