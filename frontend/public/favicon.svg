<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gradient for outer C ring -->
    <linearGradient id="cl-c-grad" x1="20" y1="10" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0066FF" />
      <stop offset="40%" stop-color="#2563EB" />
      <stop offset="75%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#9333EA" />
    </linearGradient>

    <!-- Top facet gradient for arrow -->
    <linearGradient id="cl-arrow-top" x1="34" y1="45" x2="64" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0052D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Bottom facet gradient for arrow -->
    <linearGradient id="cl-arrow-bottom" x1="48" y1="64" x2="64" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Drop shadow -->
    <filter id="cl-drop" x="0" y="0" width="100" height="100" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#2563EB" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer C Ring -->
  <path
    d="M 74 28 A 33 33 0 1 0 74 72"
    stroke="url(#cl-c-grad)"
    stroke-width="14.5"
    stroke-linecap="round"
    fill="none"
    filter="url(#cl-drop)"
  />

  <!-- Inner Arrow / Compass Pointer -->
  <!-- Top-left Facet -->
  <path
    d="M 64 30 L 34 45 L 45 48 Z"
    fill="url(#cl-arrow-top)"
  />

  <!-- Bottom-right Facet -->
  <path
    d="M 64 30 L 45 48 L 48 64 Z"
    fill="url(#cl-arrow-bottom)"
  />
</svg>