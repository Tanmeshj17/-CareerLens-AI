services:
  # Web API Service (FastAPI) + Embedded APScheduler (Free Tier Ready)
  - type: web
    name: careerlens-api
    runtime: python
    rootDir: backend
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: ENABLE_SCHEDULER
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: careerlens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: FRONTEND_URL
        value: http://localhost:5173  # Update with your Vercel URL after deploying frontend
      - key: EMAIL_FROM
        value: CareerLens AI <onboarding@resend.dev>  # Update after adding verified domain in Resend

databases:
  # Managed PostgreSQL Database (Free Tier)
  - name: careerlens-db
    databaseName: careerlens
    user: careerlens_admin
    region: oregon
    plan: free
