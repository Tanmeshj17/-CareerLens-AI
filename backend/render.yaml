# render.yaml - Infrastructure as Code for Render.com
# Deploy: Connect your GitHub repo → Render auto-detects this file

services:
  # Backend API
  - type: web
    name: careerlens-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerlens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        value: http://localhost:5173  # Placeholder: Update with your Vercel URL post-deployment
      - key: EMAIL_FROM
        value: CareerLens AI <onboarding@resend.dev>  # Placeholder: Update after verified domain in Resend
      - key: PYTHON_VERSION
        value: "3.11.0"

  # Background ETL Worker
  - type: worker
    name: careerlens-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerlens-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: careerlens-db
    plan: free
    databaseName: careerlens
    postgresMajorVersion: "16"
