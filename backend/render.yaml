# render.yaml - Infrastructure as Code for Render.com
# Deploy: Connect your GitHub repo → Render auto-detects this file

services:
  # Backend API
  - type: web
    name: careerlens-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerlens-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://careerlens-ai.onrender.com
      - key: PYTHON_VERSION
        value: "3.11.0"

  # Background ETL Worker
  - type: worker
    name: careerlens-worker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: careerlens-db
          property: connectionString
      - key: ENVIRONMENT
        value: production

databases:
  - name: careerlens-db
    plan: free
    databaseName: careerlens
    postgresMajorVersion: "16"
